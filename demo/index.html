<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign in — Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Sign in</h1>
    <form id="login-form" action="dashboard.html" method="get">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" data-testid="login-email" required>
      <button type="submit" data-testid="login-continue-magic">
        Continue with magic link
      </button>
    </form>
  </main>
</body>
</html>
